<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4540"/>
      <stop offset="1" stop-color="#1f1c19"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#e0a346" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e0a346" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2f25"/>
      <stop offset="1" stop-color="#231b15"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#c8862e"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8452c"/>
      <stop offset="1" stop-color="#8f2415"/>
    </linearGradient>
  </defs>

  <!-- Chiselled stone tile -->
  <rect x="0" y="0" width="256" height="256" rx="36" fill="#15130f"/>
  <rect x="8" y="8" width="240" height="240" rx="30" fill="url(#stone)"/>
  <path d="M8 90 L70 78 L120 96 L180 80 L248 92 M8 176 L60 168 L110 184 L190 170 L248 180 M70 78 L64 8 M180 80 L186 8 M110 184 L104 248 M190 170 L196 248"
        stroke="#15130f" stroke-opacity="0.45" stroke-width="3" fill="none"/>
  <rect x="8" y="8" width="240" height="240" rx="30" fill="url(#glow)"/>
  <rect x="8" y="8" width="240" height="240" rx="30" fill="none" stroke="#6b6158" stroke-width="3"/>

  <!-- Queued cards, back to front -->
  <g stroke-width="5" stroke-linejoin="round">
    <rect x="86" y="38" width="100" height="136" rx="12" fill="url(#card)" stroke="#8a6230" transform="rotate(10 136 106)"/>
    <rect x="78" y="46" width="100" height="136" rx="12" fill="url(#card)" stroke="#a9772f" transform="rotate(-6 128 114)"/>
    <rect x="72" y="58" width="104" height="140" rx="12" fill="url(#card)" stroke="url(#gold)"/>
  </g>

  <!-- Upgrade chevrons on the front card -->
  <g fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M98 128 L124 102 L150 128"/>
    <path d="M98 164 L124 138 L150 164"/>
  </g>

  <!-- Queue count badge -->
  <circle cx="186" cy="190" r="36" fill="#15130f"/>
  <circle cx="186" cy="190" r="31" fill="url(#badge)" stroke="url(#gold)" stroke-width="5"/>
  <text x="186" y="206" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="46" fill="#fff4dc">3</text>
</svg>
